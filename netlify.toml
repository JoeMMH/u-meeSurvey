[build]
  base = "umee-survey-netlify-protected"
  publish = "."
  functions = "netlify/functions"

# The whole report sits behind real HTTP Basic Auth, enforced by gate.js.
[[redirects]]
  from = "/"
  to = "/.netlify/functions/gate"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/.netlify/functions/gate"
  status = 200
  force = true

[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask"
  status = 200
  force = true
