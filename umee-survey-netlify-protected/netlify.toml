[build]
  publish = "."
  functions = "netlify/functions"

# The whole report sits behind real HTTP Basic Auth, enforced by gate.js
# (not a client-side trick — a browser popup, checked server-side).
[[redirects]]
  from = "/"
  to = "/.netlify/functions/gate"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/.netlify/functions/gate"
  status = 200
  force = true

# Lets the front-end keep calling the tidy path /api/ask, while Netlify
# actually serves it from /.netlify/functions/ask. This route checks the
# same Basic Auth credentials as the page itself.
[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask"
  status = 200
  force = true
